name: TikTok Nudge Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'   # daily at 20:00 UTC

jobs:
  nudge:
    runs-on: ubuntu-latest

    env:
      GM_API_TOKEN: ${{ secrets.GM_API_TOKEN }}
      GM_RECIPE_UUID: ${{ secrets.GM_RECIPE_UUID }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TIKTOK_PACKAGE: com.zhiliaoapp.musically
      TIKTOK_ACTIVITY: com.ss.android.ugc.aweme.splash.SplashActivity
      APPIUM_SERVER: http://127.0.0.1:4723/wd/hub
      ANDROID_HOME: /usr/local/android-sdk
      ANDROID_SDK_ROOT: /usr/local/android-sdk
      PATH: /usr/local/android-sdk/platform-tools:/usr/local/android-sdk/emulator:/usr/local/android-sdk/tools:/usr/local/android-sdk/tools/bin:$PATH

    steps:
      - name: Install missing tools (tar, unzip, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y tar unzip jq

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv selenium Appium-Python-Client requests

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Appium + Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Genymotion gmsaas CLI
        run: |
          curl -sSL https://github.com/Genymobile/Genymotion-Cloud-CLI/releases/latest/download/gmsaas-linux-x64.tar.gz \
            | sudo tar xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/gmsaas

      - name: Auth to Genymotion Cloud
        run: gmsaas auth login $GM_API_TOKEN

      - name: Start virtual device
        id: start_device
        run: |
          DEVICE_INFO=$(gmsaas instances start $GM_RECIPE_UUID tiktokbot --json)
          echo "$DEVICE_INFO"
          DEVICE_ID=$(echo "$DEVICE_INFO" | jq -r '.instance.uuid')
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Wait for device to boot
        run: sleep 20

      - name: Connect ADB
        run: gmsaas instances adbconnect $DEVICE_ID

      - name: Start Appium server
        run: |
          nohup appium --log-level info &
          sleep 5

      - name: Run TikTok Nudge Bot
        run: python tiktok_nudge.py

      - name: Stop Genymotion instance
        if: always()
        run: |
          if [ -n "$DEVICE_ID" ]; then
            gmsaas instances stop $DEVICE_ID
          fi
