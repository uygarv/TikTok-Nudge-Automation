name: TikTok Nudge Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'  # Her gün 20:00 UTC

jobs:
  nudge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv selenium Appium-Python-Client requests

      - name: Run TikTok Nudge Bot
        env:
          GM_API_TOKEN: ${{ secrets.GM_API_TOKEN }}
          GM_RECIPE_UUID: ${{ secrets.GM_RECIPE_UUID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TIKTOK_PACKAGE: com.zhiliaoapp.musically
          TIKTOK_ACTIVITY: com.ss.android.ugc.aweme.splash.SplashActivity
          APPIUM_SERVER: http://127.0.0.1:4723/wd/hub
        run: python tiktok_nudge.py
