name: TikTok Nudge Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'  # Her gün 18:00 UTC

jobs:
  nudge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android platform-tools
        run: |
          ls -l sdk  # check that the file exists
          unzip -q sdk/platform-tools-latest-linux.zip -d $HOME/android-sdk
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH


      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js (required for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update npm globally
        run: npm install -g npm@latest

      - name: Kill existing adb server
        run: |
          adb kill-server || true
          pkill -9 adb || true

      - name: Install Appium
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2 || true

      - name: Install gmsaas CLI
        run: |
          python3 -m pip install --upgrade pip
          pip3 install gmsaas

          gmsaas auth token ${{ secrets.GM_API_TOKEN }}
          gmsaas config set android-sdk-path $HOME/android-sdk

          gmsaas doctor


      - name: Run TikTok Nudge Bot
        env:
          GM_API_TOKEN: ${{ secrets.GM_API_TOKEN }}
          GM_RECIPE_UUID: ${{ secrets.GM_RECIPE_UUID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NUDGE_USERS: ${{ secrets.NUDGE_USERS }}
          TIKTOK_PACKAGE: com.zhiliaoapp.musically
          TIKTOK_ACTIVITY: com.ss.android.ugc.aweme.splash.SplashActivity
          APPIUM_SERVER: http://127.0.0.1:4723/wd/hub
        run: python tiktok_nudge.py
